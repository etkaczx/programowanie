[build-system]
requires = ['setuptools']
build-backend = 'setuptools.build_meta'

[project]
name = 'data-oriented-programming'
version = '0.1'
description = 'Data oriented progrmming course. Examples for the programming course'
requires-python = '>=3.9'
dependencies =[
'jupyter',
'jupytext',
'numpy',
'pandas']

[tool.setuptools.packages.find]
where = ["."]
include = ["src","src.*"]

